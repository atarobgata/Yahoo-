const stock=[
{q:'「最近、朝起きるのがつらいです。どうしたらいいですか？」',a:['まずは睡眠時間を見直して、無理のない生活をしてみては？','朝起きるのがつらい原因を書かないと、回答のしようがありません。','「どうしたらいいですか？」だけではなく、普段の生活を書いた方がいいですよ。'],g:1,art:'☀️🛏️',note:'情報不足を淡々と指摘する。でも、ちょっとだけ上から目線。'},
{q:'「彼氏がLINEを既読無視します。嫌われたのでしょうか？」',a:['忙しい可能性もあります。少し待ってみては？','本人に聞けばいいだけでは？なぜここで聞く必要があるんですか？','一度、直接話してみるのが一番だと思います。'],g:1,art:'📱💭',note:'解決策より「なぜ知恵袋で聞くのか」を問う。知恵袋の知恵袋らしさ。'},
{q:'「会社の飲み会に行きたくありません。断ってもいい？」',a:['無理に参加する必要はないと思います。','その程度のことも自分で決められないんですか？社会人ですよね？','断るなら、早めに幹事へ伝えるといいですよ。'],g:1,art:'🍺💼',note:'正論だけなら普通。そこに「社会人ですよね？」を足すと急に知恵袋になる。'},
{q:'「おすすめの掃除機を教えてください。」',a:['予算や部屋の広さが分からないと何とも言えません。','掃除機くらい自分で調べたらどうですか？検索すればいくらでも出てきますよ。','コードレスは取り回しが楽なので、候補に入れてみては？'],g:1,art:'🧹🔎',note:'「検索すれば出てくる」。知恵袋そのものを否定する回答。'},
{q:'「30歳ですが、まだ親に怒られます。どうすれば？」',a:['一度、落ち着いて話し合ってみてはいかがでしょう。','30歳にもなって親に怒られるようなことをしている自分を、まず反省した方がいいのでは？','距離を置くことも一つの方法だと思います。'],g:1,art:'🏠😑',note:'年齢を出して、相談内容から人格全体へ少しずつ話を広げる。'},
{q:'「友達にお金を貸してと言われました。貸すべき？」',a:['返ってこなくても困らない金額なら、という基準もあります。','そんなことも判断できないなら、お金を貸す以前に金銭感覚を見直した方がいいですよ。','断ってしまっても、悪いことではないと思います。'],g:1,art:'💴🤝',note:'質問への回答をしながら、質問者の判断力まで採点し始める。'},
{q:'「子どもがゲームばかりしています。どうしたらいいですか？」',a:['時間を決めるなど、家庭でルールを作ってみては？','ゲームを与えたのは誰ですか？まず親御さん自身が考えた方がいいのでは。','一緒に遊んでみて、子どもの様子を見るのもいいと思います。'],g:1,art:'🎮👨‍👩‍👧',note:'原因を質問者に返却してから、回答を開始する古典的な型。'},
{q:'「仕事でミスをしました。立ち直れません。」',a:['誰でもミスはあります。次に活かせば大丈夫です。','ミスの内容も書かずに立ち直れないと言われても、こちらには何も分かりません。','今日は早めに休んで、明日から切り替えてみては？'],g:1,art:'💻😵',note:'情報不足を指摘するだけのはずが、なぜか心まで切る。'},
{q:'「電車で隣の人のイヤホン音漏れが気になります。」',a:['車掌さんに相談するのも一つの方法です。','気になるなら本人に言えばいいだけでは？なぜここで質問するんですか？','車両を移動してみるのもいいと思います。'],g:1,art:'🚃🎧',note:'質問サイトへの存在意義そのものを問うタイプ。'},
{q:'「この服、デートに着ていっても変じゃないですか？」',a:['写真があれば、もう少し具体的に答えられます。','人に聞かないと服も選べないんですか？自分が着たい服を着ればいいでしょう。','相手との関係や場所によっても変わると思います。'],g:1,art:'👕❤️',note:'「好きな服を着ればいい」という正論で、質問そのものを無効化。'},
{q:'「カレーを作ったのですが、じゃがいもが硬いです。」',a:['もう少し煮込めば柔らかくなると思います。','火加減や切り方を書かないと、こちらには判断できません。','レシピ通りに作ったのであれば、煮込み時間を確認してみては？'],g:1,art:'🍛🥔',note:'一見まとも。でも「情報を書かないと答えられない」が微妙に刺さる。'},
{q:'「休日なのに何もすることがありません。」',a:['散歩や映画など、普段しないことをしてみては？','「何もすることがない」のではなく、自分で何かをしようとしていないだけでは？','何もしない休日があってもいいと思います。'],g:1,art:'🛋️☀️',note:'正論なのか説教なのか、その境界線を狙った回答。'},
{q:'「上司に注意されました。納得できません。」',a:['まずは注意された内容を整理してみては？','納得できないのは自由ですが、注意された理由くらい自分で考えた方がいいのでは？','信頼できる同僚に相談してみるのもいいと思います。'],g:1,art:'👔📣',note:'相手の事情を聞く前に「自分で考えて」を差し込む。'},
{q:'「おすすめのラーメン屋さんありますか？」',a:['好みを教えてもらえれば、もう少し絞れます。','ラーメン屋くらい自分で探せませんか？食べログでも見ればいいでしょう。','あっさり系ならいくつかありますよ。'],g:1,art:'🍜🔍',note:'親切そうに見えて、最後に検索サイトへ突き放す。'},

{q:'「スマホを見すぎてしまいます。どうすれば？」',a:['使用時間の制限を設定してみては？','スマホを見すぎると分かっているなら、見なければいいだけでは？','寝る前だけスマホを別の部屋に置く方法もあります。'],g:1,art:'📱⏳',note:'解決策があまりにも簡単すぎて、質問者を責めたくなる型。'}

let questions=[],idx=0,score=0,streak=0,timeLeft=30,timerId=null,answered=false,audio=null,master=null;
function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination)}
function snd(f,d,type='sine',g=.06,slide=0){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(45,f+slide),audio.currentTime+d);a.gain.setValueAtTime(.0001,audio.currentTime);a.gain.exponentialRampToValueAtTime(g,audio.currentTime+.01);a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(a);a.connect(master);o.start();o.stop(audio.currentTime+d+.02)}
function startGame(){initAudio();if(audio.state==='suspended')audio.resume();questions=[...stock].sort(()=>Math.random()-.5).slice(0,6);idx=0;score=0;streak=0;document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden');showQ()}
function showQ(){answered=false;timeLeft=30;let d=questions[idx];document.getElementById('count').textContent=`${idx+1} / 6`;document.getElementById('timer').textContent='30.0';document.getElementById('timer').classList.remove('danger');document.getElementById('bar').style.width='100%';document.getElementById('question').innerHTML=`<div class="illustration"><div class="art-scene"><span>${d.art}</span><i>?</i></div></div><div class="qbox">${d.q}</div>`;let c=document.getElementById('choices');c.innerHTML='';let opts=d.a.map((text,orig)=>({text,orig})).sort(()=>Math.random()-.5);d.playG=opts.findIndex(x=>x.orig===d.g);d.playA=opts.map(x=>x.text);opts.forEach((x,n)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${String.fromCharCode(65+n)}</b>${x.text}`;b.onclick=()=>answer(n,b);c.appendChild(b)});document.getElementById('feedback').innerHTML='';document.getElementById('feedback').className='feedback';document.getElementById('judge').className='judge hidden';document.getElementById('next').style.display='none';clearInterval(timerId);timerId=setInterval(tick,100);}
function tick(){if(answered)return;timeLeft-=.1;document.getElementById('timer').textContent=Math.max(0,timeLeft).toFixed(1);document.getElementById('timer').classList.toggle('danger',timeLeft<=7);document.getElementById('bar').style.width=Math.max(0,timeLeft/30*100)+'%';if(timeLeft<=0)answer(-1,null,true)}
const taunts=['社会人ですよね？','質問する前に、まずご自分で考えてみてはいかがですか？','それを人に聞いている時点で、少し心配です。','もう少し状況を詳しく書いた方がいいと思いますよ。','これだけの情報で何を答えろというのでしょうか。','まず検索してから質問されてはいかがでしょう。','「どうしたらいいですか？」では、こちらもどうしようもありません。','その年齢で、まだ人に答えを聞くんですか？','自分のことくらい自分で決めたらどうですか？','回答者にそこまで求めるのはどうかと思います。','まず質問の仕方から見直した方がいいのでは？','それを知恵袋で聞く意味、ありますか？'];
function answer(n,btn,timeout=false){if(answered)return;answered=true;clearInterval(timerId);let d=questions[idx],ok=n===d.playG;if(ok){streak++;let pts=150+streak*35+Math.round(timeLeft*8);score+=pts;if(btn)btn.classList.add('good');document.getElementById('feedback').className='feedback goodf';document.getElementById('feedback').innerHTML=`<b>正解。</b> +${pts}点　連続 ${streak}<br>${d.note}`;happy()}else{streak=0;if(btn)btn.classList.add('bad');document.querySelectorAll('.choice')[d.playG].classList.add('good');let t=taunts[Math.floor(Math.random()*taunts.length)];document.getElementById('feedback').className='feedback badf';document.getElementById('feedback').innerHTML=`<b>${timeout?'時間切れ。':'不正解。'}</b><br><span class="angry">${t}</span><br>正解は「${String.fromCharCode(65+d.playG)}」。`;angry()}document.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('next').style.display='block';}
function showJudge(ok,title,text){const j=document.getElementById('judge');document.getElementById('judgeFaceImg').src=ok?faceSrc:badFaceSrc;j.className='judge '+(ok?'good':'bad');document.getElementById('judgeTitle').textContent=title;document.getElementById('judgeText').textContent=text;document.querySelector('.judge-face').classList.toggle('mock',!ok)}
function happy(){snd(520,.08,'triangle',.06,180);setTimeout(()=>snd(780,.1,'sine',.05,160),75);let f=document.getElementById('flash');f.className='flash go';setTimeout(()=>f.className='flash',500)}
function angry(){snd(130,.13,'sawtooth',.08,-45);setTimeout(()=>snd(75,.16,'square',.05,-20),55);let f=document.getElementById('redflash');f.className='redflash go';document.getElementById('game').classList.remove('shake');void document.getElementById('game').offsetWidth;document.getElementById('game').classList.add('shake');setTimeout(()=>f.className='redflash',500)}
function answer(n,btn,timeout=false){if(answered)return;answered=true;clearInterval(timerId);let d=questions[idx],ok=n===d.playG;if(ok){streak++;let pts=150+streak*35+Math.round(timeLeft*3);score+=pts;if(btn)btn.classList.add('good');showJudge(true,['正解。','それです。','なかなか。'][Math.floor(Math.random()*3)],d.note);happy()}else{streak=0;if(btn)btn.classList.add('bad');document.querySelectorAll('.choice')[d.playG].classList.add('good');let t=taunts[Math.floor(Math.random()*taunts.length)];showJudge(false,timeout?'時間切れ。':'不正解。',t+'\n正解は「'+String.fromCharCode(65+d.playG)+'」。');angry()}document.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('next').style.display='block'}
function nextQ(){idx++;if(idx>=6)finish();else showQ()}
function finish(){clearInterval(timerId);document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('count').textContent='結果';document.getElementById('bar').style.width='0%';document.getElementById('finalScore').textContent=score+'点';let r,c;if(score>=1250){r='知恵袋の住人';c='回答欄に住民票を移せます。'}else if(score>=900){r='かなり知恵袋';c='正論に余計な一言を足す技術があります。'}else if(score>=600){r='回答者見習い';c='まだ優しさが残っています。'}else{r='善良なインターネット市民';c='その優しさ、知恵袋では少し浮きます。'}document.getElementById('rank').textContent=r;document.getElementById('comment').textContent=c; if(score>=900) snd(660,.12,'triangle',.04,180)}
async function shareScore(){let text=`「正しい知恵袋攻撃を選べ」で${score}点。私は${document.getElementById('rank').textContent}でした。知恵袋度を測ってみてください。`;try{if(navigator.share)await navigator.share({text});else await navigator.clipboard.writeText(text)}catch(e){}}
</script></body>
